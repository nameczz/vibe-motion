<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Bobby Earth</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #eef4ff;
        font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        display: grid;
        place-items: center;
      }
      .preview-shell {
        position: relative;
        width: min(calc(100vw - 36px), calc((100vh - 36px) * 16 / 9));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #000;
      }
      .webgl-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }
      .camera-frame {
        position: absolute;
        inset: 0;
        z-index: 2;
        border: 1px solid rgba(226, 239, 255, 0.62);
        pointer-events: none;
      }
      .app-export {
        display: block;
      }
      .app-export .preview-shell {
        width: auto;
        height: auto;
        aspect-ratio: auto;
      }
      .app-export .camera-frame,
      .app-export .render-panel,
      .is-export-mode .camera-controls {
        display: none;
      }
      .camera-controls {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 10;
        width: min(360px, calc(100vw - 36px));
        padding: 14px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(5, 8, 14, 0.78);
        color: #f4f7fb;
        backdrop-filter: blur(12px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.38);
      }
      .camera-controls__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 650;
      }
      .camera-controls__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .camera-controls__grid {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
      }
      .camera-controls__grid span {
        color: #c9d6e8;
      }
      .camera-controls code {
        min-width: 0;
        color: #f4f7fb;
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      .camera-controls__slider {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 46px;
        gap: 10px;
        align-items: center;
      }
      .camera-controls__slider input {
        width: 100%;
        min-width: 0;
        accent-color: #f5c451;
      }
      .camera-controls__button {
        min-width: 0;
        height: 30px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #eef4ff;
        font: inherit;
        cursor: pointer;
      }
      .camera-controls__button:hover,
      .camera-controls__button:focus-visible,
      .camera-controls__button[aria-pressed="true"] {
        background: rgba(245, 196, 81, 0.22);
        border-color: rgba(245, 196, 81, 0.55);
        outline: none;
      }
      .camera-controls__button--toggle {
        min-width: 118px;
      }
      .render-panel {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 10;
        width: min(320px, calc(100vw - 36px));
        padding: 14px;
        border: 1px solid rgba(226, 239, 255, 0.18);
        border-radius: 8px;
        background: rgba(8, 16, 22, 0.78);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(14px);
      }
      .frame-control {
        display: grid;
        grid-template-columns: 54px 84px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        color: #dce6ef;
      }
      .frame-control input[type="number"] {
        width: 84px;
        min-height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        color: #eef4ff;
        background: rgba(0, 0, 0, 0.22);
        padding: 0 8px;
      }
      .frame-control output {
        color: #9fb0bf;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .frame-range {
        width: 100%;
        margin: 10px 0 12px;
        accent-color: #61d394;
      }
      .export-size-control {
        display: grid;
        grid-template-columns: 54px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        margin-bottom: 10px;
        color: #dce6ef;
      }
      .export-size-control select {
        min-height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        color: #eef4ff;
        background: rgba(0, 0, 0, 0.22);
        padding: 0 8px;
      }
      .export-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .export-controls button {
        min-height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        color: #eef4ff;
        background: #315a63;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      .export-controls button:hover {
        background: #3e707b;
      }
      .export-controls button:disabled {
        color: #78909d;
        background: rgba(49, 90, 99, 0.38);
        cursor: not-allowed;
      }
      .export-status {
        min-height: 18px;
        margin-top: 10px;
        color: #9fb0bf;
        font-size: 12px;
      }
      .export-status:empty {
        display: none;
      }
      @media (max-width: 620px) {
        .render-panel {
          top: 12px;
          right: 12px;
          width: calc(100vw - 24px);
          padding: 12px;
        }
        .camera-controls {
          left: 12px;
          bottom: 12px;
          width: calc(100vw - 24px);
        }
      }
    </style>
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
        }
			}
		</script>
  </head>
  <body>
    <main id="app">
      <section id="preview-shell" class="preview-shell" aria-label="16:9 scene preview">
        <div class="camera-frame" aria-hidden="true"></div>
      </section>
      <section class="render-panel" aria-label="Render controls">
        <label class="frame-control">
          Frame
          <input id="render-frame" type="number" min="0" step="1" value="0" />
          <output id="render-frame-count">1 / 1</output>
        </label>
        <input
          id="render-frame-range"
          class="frame-range"
          type="range"
          min="0"
          max="0"
          step="1"
          value="0"
        />
        <label class="export-size-control">
          Size
          <select id="export-scale">
            <option value="1" selected>2K</option>
            <option value="2">4K</option>
          </select>
        </label>
        <div class="export-controls">
          <button id="export-frame" type="button">Export PNG</button>
          <button id="export-sequence" type="button">Export ZIP</button>
        </div>
        <div id="export-status" class="export-status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
