<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Spotlight Reveal</title>
<style>
  :root {
    color-scheme: only dark;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 32%, rgba(255, 211, 106, 0.12), transparent 28%),
      linear-gradient(180deg, #07090d 0%, #0b1018 42%, #05060a 100%);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg {
    width: min(100vw, 1920px);
    height: auto;
    max-height: min(100vh, 1080px);
    display: block;
    overflow: visible;
  }

  .title-base,
  .title-reveal {
    font-family: "Space Grotesk", "Inter", "Avenir Next", Arial, sans-serif;
    font-size: 146px;
    font-weight: 700;
    letter-spacing: -0.06em;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .title-base {
    fill: rgba(255, 255, 255, 0.025);
  }

  .title-reveal {
    fill: #fff8e6;
    filter: url(#titleGlow);
  }

  #beam-shell,
  #beam-core {
    transform-box: fill-box;
    transform-origin: center;
    animation: sweepArc 6000ms cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
  }

  #beam-core {
    animation-duration: 6200ms;
    animation-timing-function: cubic-bezier(0.17, 0.84, 0.44, 1);
  }

  #beam-shell {
    opacity: 0.44;
    mix-blend-mode: screen;
    filter: url(#beamBlur);
  }

  #beam-core {
    opacity: 0.88;
  }

  #glow-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: ringPulse 6000ms cubic-bezier(0.42, 0, 0.2, 1) infinite alternate;
  }

  @keyframes sweepArc {
    0% {
      transform: translate(-700px, 500px) rotate(-14deg) scale(0.9, 0.72);
    }
    22% {
      transform: translate(-180px, 520px) rotate(-4deg) scale(1, 0.78);
    }
    50% {
      transform: translate(820px, 540px) rotate(5deg) scale(1.1, 0.88);
    }
    78% {
      transform: translate(1660px, 520px) rotate(15deg) scale(1, 0.8);
    }
    100% {
      transform: translate(2480px, 500px) rotate(22deg) scale(0.92, 0.72);
    }
  }

  @keyframes ringPulse {
    0% {
      transform: scale(0.86);
      opacity: 0.28;
    }
    28% {
      opacity: 0.58;
    }
    60% {
      transform: scale(1.04);
      opacity: 0.68;
    }
    100% {
      transform: scale(1);
      opacity: 0.48;
    }
  }
</style>
</head>
<body>
  <svg id="mainSVG" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Light spotlight reveal">
    <defs>
      <filter id="beamBlur" x="-100%" y="-100%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="26" />
      </filter>
      <filter id="titleGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <mask id="spotMask">
        <rect width="1920" height="1080" fill="black" />
        <g id="beam-core">
          <ellipse cx="0" cy="0" rx="480" ry="188" fill="white" opacity="0.98" />
          <ellipse cx="0" cy="0" rx="380" ry="142" fill="white" opacity="0.86" />
        </g>
      </mask>
    </defs>

    <rect width="1920" height="1080" fill="none" />
    <g opacity="0.9">
      <circle cx="960" cy="540" r="430" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
      <circle cx="960" cy="540" r="620" fill="none" stroke="rgba(255,211,106,0.04)" stroke-width="1.5" stroke-dasharray="10 18" />
    </g>

    <g>
      <text class="title-base" x="960" y="556">VIBE MOTION</text>
    </g>

    <g mask="url(#spotMask)">
      <text class="title-reveal" x="960" y="556">VIBE MOTION</text>
      <text
        x="960"
        y="656"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family='"Space Grotesk", "Inter", Arial, sans-serif'
        font-size="34"
        letter-spacing="0.26em"
        fill="rgba(255,248,230,0.72)"
      >SPOTLIGHT SWEEP</text>
    </g>

    <g id="beam-shell">
      <ellipse cx="0" cy="0" rx="528" ry="220" fill="rgba(255, 240, 204, 0.38)" />
      <ellipse cx="0" cy="0" rx="408" ry="134" fill="rgba(255, 255, 255, 0.28)" />
    </g>

    <g id="glow-ring" opacity="0.7">
      <ellipse cx="960" cy="540" rx="430" ry="170" fill="none" stroke="rgba(255,211,106,0.2)" stroke-width="2" />
    </g>
  </svg>

  <script>
    window.__effectReady = true;
  </script>
</body>
</html>
